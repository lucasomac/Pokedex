//apply from: '../jacoco.gradle'

android {
    namespace 'br.com.lucolimac.pokedex'
    compileSdk 36
    defaultConfig {
        applicationId "br.com.lucolimac.pokedex"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
//            enableUnitTestCoverage true
//            enableAndroidTestCoverage true
        }
    }
    kover {
        reports {
            filters {
                excludes {
                    // exclusion rules - classes to exclude from report
                    packages("androidx.compose.ui.tooling.preview.Preview", "androidx.databinding", "br.com.lucolimac.pokedex.databinding")
                }
                includes {
                    // inclusion rules - classes only those that will be present in reports
                }
            }
            verify {
                rule {
                    minBound(25)
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        viewBinding true
        //noinspection DataBindingWithoutKapt
        dataBinding true
        compose true
    }
}
dependencies {
    implementation(project(":attributes"))

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    // Gson
    implementation libs.gson
    // OKHttpClient
    implementation platform(libs.okhttp.bom)
    implementation libs.okhttp3.okhttp
    implementation libs.okhttp3.logging.interceptor
    // Retrofit
    implementation libs.retrofit
    implementation libs.converter.gson
    // Koin
    implementation libs.koin.android
    implementation libs.koin.android.compat
    implementation libs.koin.androidx.workmanager
    implementation libs.koin.androidx.navigation
    // Paging
    implementation(libs.androidx.paging.runtime.ktx)
    // Glide
    implementation libs.glide


    // Tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    testImplementation libs.mockk.android
    testImplementation libs.mockk.agent
    androidTestImplementation libs.mockk.android
    androidTestImplementation libs.mockk.agent
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.archunit.junit4
}