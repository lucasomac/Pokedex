// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        //Libraries versions
        kotlin_version = '2.0.20'
        navigation_version = '2.8.2'
        koin_version = '4.0.0'
        compose_boom_version = '2024.09.03'
        jacoco_version = '0.8.12'
        gradle_plugin_version = '8.7.0'
        okhttp_version = '4.12.0'
        gson_version = '2.11.0'
        retrofit_version = '2.11.0'
        glide_version = '4.16.0'
        pagging_version = '3.3.2'
        junit_version = '4.13.2'
        expresso_version = '3.6.1'
        material_version = '1.12.0'
        core_ktx_version = '1.13.1'
        constraint_layout_version = '2.1.4'
        app_comppat_version = '1.7.0'
        // Versions of android compiles
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        // App versions attributes
        versionCode = 1
        versionName = "1.0"
    }
    dependencies {
        classpath("androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jacoco:org.jacoco.core:$jacoco_version"
    }
    repositories {
        mavenCentral()
    }
}
plugins {
    id "com.android.application" version "8.7.0" apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlin_version" apply false
}